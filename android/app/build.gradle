apply plugin: 'com.android.application'

android {
    namespace "com.visualchess.app"
    compileSdk 34

    defaultConfig {
        applicationId "com.visualchess.app"
        minSdkVersion 22
        targetSdkVersion 34
        versionCode 1
        versionName "1.0.0"
        // 仅保留主流 ABI，加快构建并减小包体积
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64' }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 复用本机固定 debug 签名，保证 OTA / 覆盖安装签名一致
    signingConfigs {
        debug {
            def ks = new File(System.getProperty("user.home") + "/.android/debug.keystore")
            storeFile ks
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    // 仅 AndroidX 基础库（腾讯镜像可获取，且「闪光点」项目已缓存）
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
}
